services:
  postgres:
    image: ${POSTGRES_IMAGE:?set immutable POSTGRES_IMAGE digest}
    environment:
      POSTGRES_DB: haha
      POSTGRES_USER: haha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - release-postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haha -d haha"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:?set immutable REDIS_IMAGE digest}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - release-redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    image: ${HAHA_API_IMAGE:?set immutable HAHA_API_IMAGE digest}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://haha:${POSTGRES_PASSWORD}@postgres:5432/haha
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  media-init:
    image: ${HAHA_API_IMAGE:?set immutable HAHA_API_IMAGE digest}
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/haha/community-media && chown -R 65532:65532 /var/lib/haha/community-media"]
    volumes:
      - release-media-data:/var/lib/haha/community-media
    networks: [data]
    restart: "no"

  api:
    image: ${HAHA_API_IMAGE:?set immutable HAHA_API_IMAGE digest}
    environment:
      DATABASE_URL: postgresql+psycopg://haha:${POSTGRES_PASSWORD}@postgres:5432/haha
      REDIS_URL: redis://redis:6379/0
      HAHA_ENVIRONMENT: staging
      HAHA_AUTH_MODE: jwt
      HAHA_JWT_SECRET: ${HAHA_JWT_SECRET:?set HAHA_JWT_SECRET}
      HAHA_METRICS_TOKEN: ${HAHA_METRICS_TOKEN:?set HAHA_METRICS_TOKEN}
      HAHA_JWT_ISSUER: ${HAHA_JWT_ISSUER:-haha-auth}
      HAHA_JWT_AUDIENCE: ${HAHA_JWT_AUDIENCE:-haha-api}
      HAHA_ALLOWED_ORIGINS: ${HAHA_ALLOWED_ORIGINS:?set HAHA_ALLOWED_ORIGINS}
      HAHA_RELEASE_ID: ${HAHA_RELEASE_ID:?set HAHA_RELEASE_ID}
      HAHA_GIT_SHA: ${HAHA_GIT_SHA:?set HAHA_GIT_SHA}
      HAHA_MEDIA_ROOT: /var/lib/haha/community-media
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      ARK_API_KEY: ${ARK_API_KEY:-}
      SEEDREAM_BASE_URL: ${SEEDREAM_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      SEEDREAM_MODEL: ${SEEDREAM_MODEL:-doubao-seedream-4.5}
      HAHA_CREATOR_MEDIA_ROOT: /var/lib/haha/community-media/creator
      HAHA_TUTOR_REQUEST_LIMIT_24H: ${HAHA_TUTOR_REQUEST_LIMIT_24H:-20}
    volumes:
      - release-media-data:/var/lib/haha/community-media
    ports:
      - "${HAHA_API_BIND:?set HAHA_API_BIND}:8000"
    networks: [edge, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ${HAHA_API_IMAGE:?set immutable HAHA_API_IMAGE digest}
    command: ["python", "-m", "dramatiq", "haha_worker.tasks", "--processes", "2", "--threads", "4"]
    environment:
      DATABASE_URL: postgresql+psycopg://haha:${POSTGRES_PASSWORD}@postgres:5432/haha
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      ARK_API_KEY: ${ARK_API_KEY:-}
      SEEDREAM_BASE_URL: ${SEEDREAM_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      SEEDREAM_MODEL: ${SEEDREAM_MODEL:-doubao-seedream-4.5}
      HAHA_CREATOR_MEDIA_ROOT: /var/lib/haha/community-media/creator
      HAHA_RELEASE_ID: ${HAHA_RELEASE_ID:?set HAHA_RELEASE_ID}
      HAHA_GIT_SHA: ${HAHA_GIT_SHA:?set HAHA_GIT_SHA}
    volumes:
      - release-media-data:/var/lib/haha/community-media
    networks: [data]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; from redis import Redis; assert b'dramatiq' in Path('/proc/1/cmdline').read_bytes(); assert Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${HAHA_WEB_IMAGE:?set immutable HAHA_WEB_IMAGE digest}
    environment:
      HAHA_RELEASE_ID: ${HAHA_RELEASE_ID:?set HAHA_RELEASE_ID}
      HAHA_INTERNAL_API_URL: http://api:8000
      HAHA_ENVIRONMENT: staging
      HAHA_COOKIE_SECURE: "true"
      HAHA_REFRESH_TOKEN_TTL_SECONDS: ${HAHA_REFRESH_TOKEN_TTL_SECONDS:-604800}
    ports:
      - "${HAHA_WEB_BIND:?set HAHA_WEB_BIND}:3000"
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  edge:
  data:
    internal: true

volumes:
  release-postgres-data:
  release-redis-data:
  release-media-data:
