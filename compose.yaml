services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: haha
      POSTGRES_USER: haha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haha -d haha"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://haha:${POSTGRES_PASSWORD:-local-change-me}@postgres:5432/haha
    depends_on:
      postgres:
        condition: service_healthy

  media-init:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/haha/community-media && chown -R 65532:65532 /var/lib/haha/community-media"]
    volumes:
      - media-data:/var/lib/haha/community-media
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      DATABASE_URL: postgresql+psycopg://haha:${POSTGRES_PASSWORD:-local-change-me}@postgres:5432/haha
      REDIS_URL: redis://redis:6379/0
      HAHA_ENVIRONMENT: development
      HAHA_AUTH_MODE: ${HAHA_AUTH_MODE:-dev}
      HAHA_ALLOW_DEV_AUTH: ${HAHA_ALLOW_DEV_AUTH:-true}
      HAHA_JWT_SECRET: ${HAHA_JWT_SECRET:-}
      HAHA_JWT_ISSUER: ${HAHA_JWT_ISSUER:-haha-auth}
      HAHA_JWT_AUDIENCE: ${HAHA_JWT_AUDIENCE:-haha-api}
      HAHA_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      HAHA_MEDIA_ROOT: /var/lib/haha/community-media
    volumes:
      - media-data:/var/lib/haha/community-media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    command: ["python", "-m", "dramatiq", "haha_worker.tasks", "--processes", "2", "--threads", "4"]
    environment:
      DATABASE_URL: postgresql+psycopg://haha:${POSTGRES_PASSWORD:-local-change-me}@postgres:5432/haha
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'dramatiq' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # Keep the browser origin host consistent with the published loopback
        # address. On Windows, localhost may resolve to IPv6 while Docker only
        # publishes this development port on 127.0.0.1, leaving fetch pending.
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        NEXT_PUBLIC_AUTH_MODE: ${HAHA_AUTH_MODE:-dev}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HAHA_INTERNAL_API_URL: http://api:8000
      HAHA_ENVIRONMENT: development
      HAHA_COOKIE_SECURE: "false"
      HAHA_REFRESH_TOKEN_TTL_SECONDS: ${HAHA_REFRESH_TOKEN_TTL_SECONDS:-604800}
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  media-data:
