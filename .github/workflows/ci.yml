name: HAHA CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: haha-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: haha_test
          POSTGRES_USER: haha
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haha -d haha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://haha:ci-password@127.0.0.1:5432/haha_test
      HAHA_TEST_POSTGRES_URL: postgresql+psycopg://haha:ci-password@127.0.0.1:5432/haha_test
      HAHA_ALLOW_TEST_DATABASE_RESET: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
      HAHA_JWT_SECRET: ci-auth-test-secret-at-least-32-characters
      HAHA_PASSWORD_PBKDF2_ITERATIONS: "1000"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -c constraints/runtime.txt -e ".[dev]" pip-audit==2.10.1
      - name: Audit backend dependencies
        run: python -m pip_audit --local --progress-spinner off
      - name: Static checks
        run: python -m ruff check src tests scripts
      - name: Validate external release package
        env:
          POSTGRES_IMAGE: postgres:17-alpine@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          REDIS_IMAGE: redis:8-alpine@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          HAHA_API_IMAGE: ghcr.io/example/haha-api@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          HAHA_WEB_IMAGE: ghcr.io/example/haha-web@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          HAHA_PUBLIC_API_URL: https://api.staging.example.invalid
          HAHA_PUBLIC_WEB_ORIGIN: https://staging.example.invalid
          HAHA_ALLOWED_ORIGINS: https://staging.example.invalid
          HAHA_API_BIND: 127.0.0.1:18000
          HAHA_WEB_BIND: 127.0.0.1:13000
          POSTGRES_PASSWORD: ci-release-password-value
          HAHA_JWT_SECRET: ci-release-jwt-secret-at-least-32-characters
          HAHA_METRICS_TOKEN: ci-release-metrics-secret-at-least-32-characters
          HAHA_RELEASE_ID: ci-release-package
          HAHA_GIT_SHA: ${{ github.sha }}
          HAHA_RELEASE_OWNER: ci-release-team
          HAHA_ROLLBACK_OWNER: ci-platform-oncall
          HAHA_SECURITY_OWNER: ci-security-team
          HAHA_DATA_OWNER: ci-data-team
          HAHA_ONCALL_CONTACT: ci-oncall
        run: |
          python scripts/release_preflight.py
          docker compose -f compose.release.yaml config --quiet
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Test backend with PostgreSQL
        run: python -m pytest -q
      - name: Run AI golden-dataset regression gate
        run: python scripts/run_ai_eval.py
      - name: Verify real Redis/Dramatiq worker boundary
        shell: bash
        run: |
          python -m dramatiq haha_worker.tasks --processes 1 --threads 2 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          python scripts/redis_worker_integration.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Audit production frontend dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level high
      - name: Lint frontend
        working-directory: web
        run: pnpm lint
      - name: Test community data contract
        working-directory: web
        run: pnpm test:community
      - name: Test platform shell contract
        working-directory: web
        run: pnpm test:platform-shell
      - name: Build frontend
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_AUTH_MODE: jwt
        run: pnpm build

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: haha-api:ci
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: haha-web:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            NEXT_PUBLIC_API_BASE_URL=https://api.staging.example.invalid
            NEXT_PUBLIC_AUTH_MODE=jwt
          cache-from: type=gha
          cache-to: type=gha,mode=max

  community-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser-test dependency
        run: python -m pip install -e ".[dev]"
      - name: Start the complete local stack
        run: docker compose up -d --build
      - name: Wait for API and web readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Run community real-browser acceptance
        run: python scripts/e2e_community.py
      - name: Run durable user-center real-browser acceptance
        run: python scripts/e2e_user_center_gate_c1.py
      - name: Run Community Gate C2 API acceptance
        shell: bash
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e HAHA_E2E_API_URL=http://api:8000 \
            -e HAHA_TEST_POSTGRES_URL=postgresql+psycopg://haha:${POSTGRES_PASSWORD:-local-change-me}@postgres:5432/haha \
            api python scripts/e2e_community_gate_c2.py
      - name: Run Community Gate C2 real-browser acceptance
        run: python scripts/e2e_community_gate_c2_browser.py
      - name: Exercise Learning Gate C3 through real API
        run: python scripts/e2e_learning_gate_c3.py --phase exercise
      - name: Restart API to verify durable learning state
        shell: bash
        run: |
          docker compose restart api
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Verify Learning Gate C3 after service restart
        run: python scripts/e2e_learning_gate_c3.py --phase verify
      - name: Run Learning Gate C3 real-browser acceptance
        run: python scripts/e2e_learning_gate_c3_browser.py
      - name: Exercise Commerce Gate D through real API
        shell: bash
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e HAHA_E2E_API_URL=http://api:8000 \
            -e HAHA_TEST_POSTGRES_URL=postgresql+psycopg://haha:${POSTGRES_PASSWORD:-local-change-me}@postgres:5432/haha \
            api python scripts/e2e_commerce_gate_d.py --phase exercise
      - name: Restart API to verify durable commerce state
        shell: bash
        run: |
          docker compose restart api
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Verify Commerce Gate D after service restart
        shell: bash
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e HAHA_E2E_API_URL=http://api:8000 \
            -e HAHA_TEST_POSTGRES_URL=postgresql+psycopg://haha:${POSTGRES_PASSWORD:-local-change-me}@postgres:5432/haha \
            api python scripts/e2e_commerce_gate_d.py --phase verify
      - name: Run Commerce Gate D real-browser acceptance
        run: python scripts/e2e_commerce_gate_d_browser.py
      - name: Run Platform Gate E real-browser acceptance
        run: python scripts/e2e_platform_gate_e_browser.py
      - name: Run Gate F read-only capacity threshold
        run: >-
          python scripts/production_load_gate.py
          --requests 100 --concurrency 10
          --max-error-ratio 0 --max-p95-ms 750 --max-p99-ms 1500
          --output artifacts/e2e/gate-f-load.json
      - name: Run Gate F current-schema backup and isolated restore drill
        run: >-
          python scripts/postgres_restore_drill.py
          --backup-path .tmp/gate-f-ci.dump
          --report artifacts/e2e/gate-f-restore.json
          --delete-backup-after-verify
      - name: Run Gate F media backup and isolated restore drill
        run: >-
          python scripts/media_restore_drill.py
          --backup-path .tmp/gate-f-media-ci.zip
          --report artifacts/e2e/gate-f-media-restore.json
          --require-files
          --delete-backup-after-verify
      - name: Capture service logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts/e2e
          docker compose logs --no-color --tail=300 > artifacts/e2e/docker-compose.log
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-e2e-evidence
          path: artifacts/e2e
          if-no-files-found: error
      - name: Stop the local stack
        if: always()
        run: docker compose down --volumes

  browser-session-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    env:
      HAHA_AUTH_MODE: jwt
      HAHA_ALLOW_DEV_AUTH: "false"
      HAHA_JWT_SECRET: ci-only-g3-jwt-secret-with-more-than-32-characters
      HAHA_G3_E2E_PASSWORD: ci-only-g3-account-password-2026
      HAHA_G4_E2E_PASSWORD: ci-only-g4-account-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser-test dependency
        run: python -m pip install -e ".[dev]"
      - name: Start JWT complete stack
        run: docker compose up -d --build
      - name: Bootstrap CI-only internal account
        run: >-
          docker compose run --rm
          -e HAHA_BOOTSTRAP_PASSWORD="$HAHA_G3_E2E_PASSWORD"
          api python scripts/bootstrap_internal_account.py
          --user-id g3-e2e-user --workspace-id g3-e2e
          --email g3-e2e@haha.local --role owner
      - name: Bootstrap G4 CI-only internal account
        run: >-
          docker compose run --rm
          -e HAHA_BOOTSTRAP_PASSWORD="$HAHA_G4_E2E_PASSWORD"
          api python scripts/bootstrap_internal_account.py
          --user-id g4-e2e-user --workspace-id g4-e2e
          --email g4-e2e@haha.local --role owner
      - name: Wait for API and web readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Run G3 browser-session acceptance
        run: python scripts/e2e_browser_session_g3.py
      - name: Run G4 multi-role workbench acceptance
        run: python scripts/e2e_role_workbench_g4.py
      - name: Run unified account experience acceptance
        run: python scripts/e2e_account_experience.py
      - name: Capture secure-account service logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts/e2e
          docker compose logs --no-color --tail=300 > artifacts/e2e/docker-compose.log
      - name: Upload secure-account evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-account-e2e-evidence
          path: artifacts/e2e
          if-no-files-found: error
      - name: Stop the secure-account local stack
        if: always()
        run: docker compose down --volumes
