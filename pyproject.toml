[project]
name = "haha-platform-v2"
version = "0.1.0"
description = "A clean-slate cultural media MVP for HAHA"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40,<2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
